packages:
  - apps/*
  - packages/*
  - scripts

# One version per tool across the workspace. Packages reference these with "catalog:".
catalog:
  "@types/node": ^22.20.4
  tsx: ^4.23.15
  # typescript-eslint supports TypeScript < 6.1; do not move to 7.x until it does.
  typescript: ~6.0.3
  vitest: ^5.0.3
  zod: ^4.6.5

# The Expo foundation and starters (SDK 54). Runtime versions mirror
# packages/foundation/foundation.json; a foundation test keeps them equal.
catalogs:
  foundation:
    "@expo/vector-icons": ^15.0.3
    "@react-native-async-storage/async-storage": 2.2.0
    "@react-navigation/bottom-tabs": 7.20.0
    "@react-navigation/native": 7.5.0
    "@react-navigation/native-stack": 7.20.0
    expo: ~54.0.32
    expo-constants: ~18.0.14
    expo-status-bar: ~3.0.9
    react: 19.1.0
    react-native: 0.81.5
    react-native-safe-area-context: ~5.6.0
    react-native-screens: ~4.16.0
    # Tooling for the foundation and starters, matching Expo's SDK 54 template.
    "@testing-library/react-native": 13.3.3
    "@types/jest": 29.5.14
    "@types/react": ~19.1.10
    jest: 29.7.0
    jest-expo: ~54.0.18
    react-test-renderer: 19.1.0
    typescript: ~5.9.2
