name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same services as docker-compose.yml, on the same host ports.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: buildly
          POSTGRES_PASSWORD: buildly
          POSTGRES_DB: buildly
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U buildly -d buildly"
          --health-interval 2s --health-timeout 3s --health-retries 30
      s3:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: buildly-dev
          RUSTFS_SECRET_KEY: buildly-dev-secret
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # Caches the pnpm store, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The foundation's node_modules is what the checker type-checks against (TODO 2.5).
      - uses: actions/cache@v6
        with:
          path: packages/foundation/node_modules
          key: foundation-node-modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Wait for the S3 server
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && exit 0; sleep 1; done; exit 1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The committed API digest must match the foundation source (TODO 2.3.2).
      - name: API digest is up to date
        run: pnpm --filter foundation digest && git diff --exit-code packages/foundation/dist/api-digest.md

      # The Drizzle schema has no changes missing from the committed migrations.
      - name: Migrations match the schema
        run: |
          pnpm --filter @buildly/db check
          pnpm db:generate
          test -z "$(git status --porcelain packages/db/migrations)"

      - name: Install Playwright Chromium
        run: pnpm --filter @buildly/web exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm --filter @buildly/web test:e2e
